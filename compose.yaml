services:
  clawdsroom:
    build: .
    container_name: clawdsroom
    restart: unless-stopped
    ports:
      - "8787:8787"
      - "8788:8788"
    # The HUD's connections panel reads /proc/net, which is per network namespace. To see the
    # homelab's real connections, use the host network instead of the port mapping above:
    # network_mode: host
    environment:
      - COLLECT_SYSTEM=1
      - DISK_ROOT=/host/root
      - DISK_MNT=/host/mnt
      # - CLAWDSROOM_TOKEN=change-me
      # The HUD's comms: HTTPS for the mic, and where to send speech-to-text (see README)
      # - TLS_CERT=/data/tls/cert.pem
      # - TLS_KEY=/data/tls/key.pem
      # - STT_URL=http://speaches:8000/v1/audio/transcriptions
      # - OPENCLAW_GATEWAY_TOKEN=...
      # - HERMES_API_SERVER_KEY=...
    volumes:
      - ./data:/data
      - /:/host/root:ro
      - /mnt:/host/mnt:ro
      - /proc:/proc:ro
      - /sys/class/thermal:/sys/class/thermal:ro
